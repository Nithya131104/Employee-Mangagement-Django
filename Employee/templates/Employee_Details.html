<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
    table,th,td{
    padding: 10px;
    border:  2px solid;
    background-color: cyan;
    }
</style>

</head>
<body>
<h1>EMPLOYEE DETAILS </h1>
<table border="2">
    <thead>
    <tr>
          <th>Name</th>
          <th>ID</th>
          <th>Department</th>
          <th>Salary</th>
          <th>Update</th>
          <th>Delete</th>
    </tr>
    </thead>
    <tbody>
        {% for Employee in all_detail %}
            <tr>
                <td>{{Employee.name }}</td>
                <td>{{ Employee.emp_id }}</td>
                <td>{{ Employee.department }}</td>
                <td>{{ Employee.salary }}</td>
                <td>
                    <a href="{% url 'employee_update' Employee.id %}"><button>Update</button></a>
                </td>
                <td>
                    <a href="{% url 'employee_delete' Employee.id %}"><button >Delete</button></a>
                </td>

            </tr>
        {% endfor %}
    </tbody>
</table>
</body>
</html>
